<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="ie-edge">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
		<title>USER LOGIN</title>
	</head>
	<body>
		<div class="w3-container w3-padding">
			 <div class="w3-bar w3-padding w3-container w3-indigo">
				HELLO WORLD
			 </div>
			 <br>
			 <div class="w3-mobile w3-animate-top w3-card-4 w3-container w3-padding w3-round-xlarge" style="width:50%;margin:auto">
				 <form method='post' action='/validateuser'>
					<p>
						<label>USERNAME</label>
						<input type='text' name='username' class="w3-input">
					</p>
					<p>
						<label>PASSWORD</label>
						<input type='password' name='password' class="w3-input">
					</p>
					<p>
						<input type='submit' value='LOGIN'/>
					</p>
				</form>
			</div>
		</div>
	</body>
</html>
